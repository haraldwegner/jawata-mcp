name: CI

on:
  # Sprint 28a D5b: this three-operating-system matrix existed for months and had
  # NEVER RUN — `pull_request` was its only trigger and this repository has never
  # had a pull request. A matrix nobody fires proves nothing about Windows or
  # macOS, which is precisely the defect class this sprint exists to close.
  # Deliberately NOT workflow_dispatch: a workflow someone has to remember to
  # press is the same defect wearing a different hat.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 22d: plain Maven build (Eclipse bundles from Maven Central; no Tycho, no p2).
    - name: Build
      shell: bash
      run: mvn -B -f build/pom.xml install

    # The full suite runs in-framework (the tycho-surefire replacement): the boot
    # module starts Equinox, installs the test fragments, runs JUnit inside.
    # Exit code = failed-test count.
    - name: Test (in-framework)
      timeout-minutes: 75
      shell: bash
      run: |
        # Sprint 27 D1: the embedder's Vector API backend, GUARDED. A JVM given
        # --add-modules for a module it lacks REFUSES TO START, and CI spans
        # several OS images — probe, never assume. Absent = the scalar backend,
        # which is correct and only slower, so this never fails the build.
        VECTOR=""
        if java --add-modules jdk.incubator.vector -version >/dev/null 2>&1; then
          VECTOR="--add-modules jdk.incubator.vector"
        else
          echo "note: jdk.incubator.vector unavailable — scalar backend"
        fi
        # Sprint 28a: these jobs have NO Gradle distribution — that is the
        # deliberate split, and the gradle-cell job below is the environment
        # built to prove the Gradle cells (where a skip counts as a failure).
        #
        # The property has existed since Sprint 11 and every Gradle-dependent
        # test already honours it; the matrix simply never set it. Without it
        # the Tooling API tries to DOWNLOAD a distribution mid-suite, so those
        # tests pass or fail on whether services.gradle.org answers — three
        # operating systems each fetching ~150 MB on every push. The first
        # matrix run downloaded one successfully and went green; the second
        # did not, and four tests failed for a reason that has nothing to do
        # with the code under test.
        java $VECTOR \
             -Djawata.test.fixtures="$PWD/org.jawata.core.tests/test-resources/sample-projects" \
             -Djawata.experience.shared.dir="$RUNNER_TEMP/jawata-test-store" \
             -Djawata.skip.gradle=true \
             -jar build/dist/target/dist/jawata.jar -runTests 2>&1 | tee test-run.log
        test ${PIPESTATUS[0]} -eq 0

    # Sprint 28a (1b, M13): every honest skip must be a decision somebody made.
    #
    # The assumption-skips are a feature — a cell that cannot be proven on this
    # host aborts with its reason instead of passing. The risk is that the set
    # grows quietly and coverage leaves without anyone choosing to let it go. So
    # each abort must match a committed reason pattern for this operating
    # system; one that matches nothing fails the job.
    #
    # Deliberately patterns, NOT a count. Two consecutive runs of the same work
    # reported 2 aborts then 4, because the profiler's sampling assumptions
    # depend on available CPU — running that test alone gave 11/11 with zero
    # aborts. A count would have failed a job with no defect behind it, and a
    # gate that cries wolf gets ignored.
    - name: Abort budget — no skip arrives unaccounted for
      if: always()
      shell: bash
      run: |
        case "${{ matrix.os }}" in
          ubuntu-*)  os=linux ;;
          windows-*) os=windows ;;
          macos-*)   os=macos ;;
          *)         echo "FATAL: no budget mapping for ${{ matrix.os }}"; exit 2 ;;
        esac
        build/abort-budget.sh test-run.log "$os"

    # Sprint 28 (C1): the HERMETIC half of the gate. A checkout IS a clone, so
    # this job already proves the suite passes from the repository rather than
    # from someone's working tree — but only if nothing the run produced is left
    # behind, and only if every file a test depends on was actually committed.
    #
    # Both halves were violated at once during Sprint 28: thirteen fixture files
    # existed only on the author's machine, so four tests passed there and would
    # have passed against BROKEN code anywhere else, because the thing they trip
    # over was not in the repository. Nothing in CI noticed, because CI never
    # asked.
    - name: Tree is unchanged by the test run
      if: always()
      shell: bash
      run: |
        residue="$(git status --porcelain)"
        if [ -n "$residue" ]; then
          echo "FAIL: the test run left the working tree dirty:"
          printf '%s\n' "$residue"
          echo
          echo "Either a test writes into the repository (it must not), or a file it"
          echo "produced is not covered by .gitignore. Both hide real evidence: the"
          echo "first pollutes the repo, the second makes the next 'git add -A' commit"
          echo "run residue."
          exit 1
        fi
        echo "ok: git status clean after the suite"

    - name: Upload test log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-log-${{ matrix.os }}
        path: test-run.log

  # Sprint 28 (C1): the one property cell that cannot be proven on a machine
  # without a Gradle distribution. It SKIPS there — reported as unproven, never
  # as passing — so it needs one environment where skipping is a failure.
  gradle-cell:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build
      shell: bash
      run: mvn -B -f build/pom.xml install -DskipTests

    - name: The Gradle and PDE jar cells must PASS, not skip
      timeout-minutes: 20
      shell: bash
      run: |
        # Every Gradle-dependent class runs HERE, in the one job that has a
        # distribution — because the matrix now skips them, and a test proven
        # nowhere is worse than a test that fails loudly. The aborted=0 check
        # below is what makes this real: a skip in THIS job is a failure, so
        # these cannot quietly stop running.
        {
          echo org.jawata.core.project.BuildSystemLoadTest
          echo org.jawata.core.project.ProjectImporterGradleToolingTest
          echo org.jawata.mcp.tools.verification.RunTestsShapesTest
        } > /tmp/one-class.txt
        # jawata.bundle.pools: the PDE cell resolves Require-Bundle against an
        # external pool; CI has no ~/.p2. The freshly built dist IS a pool —
        # bundles/ plus the dist root, where org.eclipse.osgi itself lives.
        # (Sprint 28 outcome audit F11: without this, the PDE jar cell
        # assumption-skipped on every CI run and nothing forced it anywhere.)
        java -Djawata.test.fixtures="$PWD/org.jawata.core.tests/test-resources/sample-projects" \
             -Djawata.test.classlist=/tmp/one-class.txt \
             -Djawata.bundle.pools="$PWD/build/dist/target/dist/bundles:$PWD/build/dist/target/dist" \
             -jar build/dist/target/dist/jawata.jar -runTests 2>&1 | tee load-cells.log
        line="$(grep 'SPIKE-TESTS' load-cells.log | tail -1)"
        echo "$line"
        case "$line" in
          *"failed=0"*) ;;
          *) echo "FAIL: tests failed"; exit 1 ;;
        esac
        # An abort here is the Gradle Tooling API finding no distribution, or
        # the PDE pool not resolving. On a machine that HAS both, that is a
        # defect in jar resolution wearing an environment skip's clothes.
        case "$line" in
          *"aborted=0"*) echo "ok: no cell skipped — the Gradle AND PDE jar cells were proven" ;;
          *) echo "FAIL: a cell skipped in an environment that can support it:"
             grep -i 'ABORTED' load-cells.log || true
             exit 1 ;;
        esac

    # This job is the ONLY one that runs Gradle against a committed fixture, so
    # it is the only one that can drop build/libs and .gradle into the fixture
    # tree — and until now it was the one job with no tree-clean step. The gate
    # was structurally blind to the residue the new job creates.
    - name: Tree is unchanged by the Gradle run
      if: always()
      shell: bash
      run: |
        residue="$(git status --porcelain)"
        if [ -n "$residue" ]; then
          echo "FAIL: the Gradle run left the working tree dirty:"
          printf '%s\n' "$residue"
          exit 1
        fi
        echo "ok: git status clean after the Gradle cell"
