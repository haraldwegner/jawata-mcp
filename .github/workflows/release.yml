name: Release

on:
  push:
    tags:
      - 'v*'
  # Sprint 28 S9. Tag-only meant the release gates could never be EXERCISED
  # without cutting a release — so the end-to-end gate added below could only
  # ever be proven by the thing it exists to protect. A dispatch run builds,
  # tests and gates exactly as a tag run does; the release-creating steps are
  # already guarded by startsWith(github.ref, 'refs/tags/'), so nothing
  # publishes — the release-creating step is tag-guarded in this same commit,
  # because it was NOT guarded before. jawata-studio has had this for the same
  # reason.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # THE PATCH-STREAK GATE IS NOT HERE ANY MORE, AND ITS ABSENCE IS A DECISION
    # (Harald, 2026-09-02): "A quality gate like too many patches is a dev
    # quality gate which stays on this machine and should not be part of the CI."
    #
    # He is right, and one evening proved it. The gate lives in
    # build/patch-streak-gate.sh and the release flow runs it ON THE DEV MACHINE
    # before a tag is pushed — which is the channel that can act in time: the
    # agent doing the tagging is stopped, the human is asked in conversation, and
    # the human's word clears it. That happened for v4.0.2, exactly as designed.
    # THEN this CI copy fired on the pushed tag and demanded the same decision a
    # second time — clearable only by a repository-settings edit, an interface
    # nobody reaches for mid-release. A control that fires AFTER the decision it
    # exists to provoke, on a channel that cannot carry the human's answer, adds
    # rounds and subtracts nothing.
    #
    # The discipline is unchanged, only its address: the local gate refuses, the
    # human rules, the record of the ruling is the conversation and the tag that
    # follows it.

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 22d: plain Maven build (Eclipse bundles from Maven Central; no Tycho, no p2).
    - name: Build
      run: mvn -B -f build/pom.xml install

    # 100, not 75 — see the same step in ci.yml for the derivation. Short version:
    # this step's runner carries a stall backstop that names the stuck test and
    # halts with 124, and it only helps if it fires BEFORE GitHub's cap, because a
    # cancelled step's log is discarded. A healthy run is 45 min and the backstop
    # waits 45, so 75 let GitHub win on any hang past the first half hour.
    # S12a / D21: the release run is the ONE place the whole suite really runs
    # on this platform, so it is the only run whose COVERAGE can speak for the
    # whole suite. It carries the JaCoCo agent (already in the dist, the same
    # version CoverageService mounts) and publishes its exec beside the aborts
    # this platform actually took. A developer imports it with
    # run_tests(action=coverage_import), which accepts it only when the class
    # ids match their own build, so evidence from a different tree is refused.
    #
    # WHAT THIS IS NOT, stated because the commit that added it claimed
    # otherwise and a C12a audit measured the claim false. This exec CANNOT
    # widen a local impacted-test selection. Selection needs per-test
    # ATTRIBUTION — the segments/ directory CoverageService writes only for a
    # local attribution=true run (CoverageService.java, the single site that
    # sets m.attribution) — and selectImpacted skips every artifact without it.
    # An imported artifact is marked IMPORTED and carries no segments, so a
    # plain agent exec is whole-suite COVERAGE and nothing more. Making it feed
    # selection would mean teaching -runTests to emit per-test segments, which
    # is a change to the runner and not to this file.
    - name: Test (in-framework)
      timeout-minutes: 100
      run: |
        java -Djawata.test.fixtures="$PWD/org.jawata.core.tests/test-resources/sample-projects" \
             -Djawata.experience.shared.dir="$RUNNER_TEMP/jawata-test-store" \
             -javaagent:"$PWD/build/dist/target/dist/tools/org.jacoco.agent-0.8.15-runtime.jar"=destfile="$PWD/release-coverage.exec" \
             -jar build/dist/target/dist/jawata.jar -runTests 2>&1 | tee test-run.log
        rc=${PIPESTATUS[0]}
        # The aborts are published as what THIS platform took, not as what the
        # expected-aborts file predicts: the point of shipping them is that a
        # reader can see the difference.
        #
        # THE PATTERN IS build/abort-budget.sh's, verbatim, and that script owns
        # it. The first version here invented its own regex and a C12a audit
        # measured one of its two alternatives to be unmatchable — real abort
        # lines are prefixed, so `^\[` never fired and everything rode on a
        # literal phrase that nothing enforces. A message without that phrase
        # would have landed in the budget gate's list and been silently missing
        # from the artifact whose whole purpose is to show what really happened.
        # If these two ever disagree again, this one is wrong.
        sed -n 's/.*~~ ABORTED //p' test-run.log > release-aborts.txt || true
        echo "platform=${{ runner.os }}" >> release-aborts.txt
        test "$rc" -eq 0

    - name: Upload suite coverage and aborts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: release-coverage-${{ runner.os }}
        path: |
          release-coverage.exec
          release-aborts.txt
        if-no-files-found: warn

    # Sprint 28 (D-UNWIRED): no public production member may reach a release
    # with every one of its callers in test code — the v3.4.0 shape, which
    # shipped its central deliverable inert past a 1591/1591 suite. This runs
    # the shipped jar over this repository through its own front door and fails
    # on any finding not in build/unwired-baseline.txt. It also asserts the
    # one-classifier invariant and a 30s time budget.
    - name: Hollow-wiring gate (called_only_by_tests)
      timeout-minutes: 20
      run: ./build/unwired-gate.sh

    # Sprint 28 D-E2E. This script has existed since Sprint 27a and ran only
    # when someone remembered to run it — which is the same failure mode it was
    # written to catch. v3.4.0 shipped its central feature completely inert with
    # a 1591/1591 unit suite, because every test supplied by hand the wiring
    # production was missing. This script cannot do that: it has ONE way in, the
    # JSON-RPC endpoint an editor uses, against the BUILT ARTIFACT on a
    # throwaway store.
    #
    # It runs AFTER "Package distributions" would be the natural reading, but
    # the dist it needs is produced by the Build step above, so it gates here —
    # before anything is uploaded, and before the release is created.
    - name: End-to-end gate (the product's own front door)
      timeout-minutes: 20
      run: ./build/end-to-end-test.sh

    - name: Upload end-to-end log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: end-to-end-log
        path: |
          e2e-*.log
          build/e2e-fixture/entries.json
        if-no-files-found: ignore

    # always(): runs on failure, step-timeout AND cancellation — the per-class
    # progress log survives every outcome (GitHub discards a cancelled step's
    # own log; this artifact is the insurance).
    - name: Upload test log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: release-test-log
        path: test-run.log

    # ONE universal dist (every platform's SWT fragment ships; Equinox resolves the
    # matching one at boot). The five per-consumer asset names are kept for full
    # compatibility with install.sh and jawata-studio's release manager — identical
    # content under each name.
    - name: Package distributions
      run: |
        set -e
        TAG=${{ github.ref_name }}
        OUT="$GITHUB_WORKSPACE/build/dist/target"
        # S19 dogfood: the studio starts Lombok workspaces with this jar as an agent; a dist
        # without it silently breaks every Lombok project (build/lombok-agent-probe.sh).
        test -f "$OUT/dist/lombok.jar" || { echo "dist has no lombok.jar"; exit 1; }
        cd "$OUT" && cp -r dist "jawata-$TAG"
        tar -czf "jawata-$TAG-linux-x64.tar.gz"   "jawata-$TAG"
        cp jawata-$TAG-linux-x64.tar.gz "jawata-$TAG-linux-arm64.tar.gz"
        zip -rq "jawata-$TAG-win32-x64.zip"  "jawata-$TAG"
        cp jawata-$TAG-win32-x64.zip "jawata-$TAG-macos-x64.zip"
        cp jawata-$TAG-win32-x64.zip "jawata-$TAG-macos-arm64.zip"
        rm -rf "jawata-$TAG"
        echo "=== packaged artifacts ===" && ls -la jawata-"$TAG"-*

    - name: Pick release body
      id: notes
      run: |
        notes_file="docs/release-notes/${{ github.ref_name }}.md"
        if [ -f "$notes_file" ]; then
          echo "body_path=$notes_file" >> "$GITHUB_OUTPUT"
        else
          echo "body_path=" >> "$GITHUB_OUTPUT"
        fi

    # TAG-GUARDED. Without this a workflow_dispatch run would try to CREATE A
    # RELEASE from a branch, with github.ref_name as the version — publishing
    # from an unreviewed branch. I wrote a comment above claiming this guard
    # already existed before checking; it did not. The dispatch trigger and this
    # guard must land in the same change, or the trigger is a publish hazard.
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          build/dist/target/jawata-${{ github.ref_name }}-*.tar.gz
          build/dist/target/jawata-${{ github.ref_name }}-*.zip
        body_path: ${{ steps.notes.outputs.body_path }}
        generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # NOTE: npm-publish and MCP-Registry-publish steps are intentionally
    # omitted. jawata-studio downloads the jar archives directly from the
    # GitHub Release attached above, which is all the runtime path needs.
