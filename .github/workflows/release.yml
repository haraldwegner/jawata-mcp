name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 22d: plain Maven build (Eclipse bundles from Maven Central; no Tycho, no p2).
    - name: Build
      run: mvn -B -f build/pom.xml install

    - name: Test (in-framework)
      timeout-minutes: 75
      run: |
        java -Djawata.test.fixtures="$PWD/org.jawata.core.tests/test-resources/sample-projects" \
             -Djawata.experience.shared.dir="$RUNNER_TEMP/jawata-test-store" \
             -jar build/dist/target/dist/jawata.jar -runTests 2>&1 | tee test-run.log
        test ${PIPESTATUS[0]} -eq 0

    # Sprint 28 (D-UNWIRED): no public production member may reach a release
    # with every one of its callers in test code — the v3.4.0 shape, which
    # shipped its central deliverable inert past a 1591/1591 suite. This runs
    # the shipped jar over this repository through its own front door and fails
    # on any finding not in build/unwired-baseline.txt. It also asserts the
    # one-classifier invariant and a 30s time budget.
    - name: Hollow-wiring gate (called_only_by_tests)
      timeout-minutes: 20
      run: ./build/unwired-gate.sh

    # Sprint 28 D-E2E. This script has existed since Sprint 27a and ran only
    # when someone remembered to run it — which is the same failure mode it was
    # written to catch. v3.4.0 shipped its central feature completely inert with
    # a 1591/1591 unit suite, because every test supplied by hand the wiring
    # production was missing. This script cannot do that: it has ONE way in, the
    # JSON-RPC endpoint an editor uses, against the BUILT ARTIFACT on a
    # throwaway store.
    #
    # It runs AFTER "Package distributions" would be the natural reading, but
    # the dist it needs is produced by the Build step above, so it gates here —
    # before anything is uploaded, and before the release is created.
    - name: End-to-end gate (the product's own front door)
      timeout-minutes: 20
      run: ./build/end-to-end-test.sh

    - name: Upload end-to-end log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: end-to-end-log
        path: |
          e2e-*.log
          build/e2e-fixture/entries.json
        if-no-files-found: ignore

    # always(): runs on failure, step-timeout AND cancellation — the per-class
    # progress log survives every outcome (GitHub discards a cancelled step's
    # own log; this artifact is the insurance).
    - name: Upload test log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: release-test-log
        path: test-run.log

    # ONE universal dist (every platform's SWT fragment ships; Equinox resolves the
    # matching one at boot). The five per-consumer asset names are kept for full
    # compatibility with install.sh and jawata-studio's release manager — identical
    # content under each name.
    - name: Package distributions
      run: |
        set -e
        TAG=${{ github.ref_name }}
        OUT="$GITHUB_WORKSPACE/build/dist/target"
        cd "$OUT" && cp -r dist "jawata-$TAG"
        tar -czf "jawata-$TAG-linux-x64.tar.gz"   "jawata-$TAG"
        cp jawata-$TAG-linux-x64.tar.gz "jawata-$TAG-linux-arm64.tar.gz"
        zip -rq "jawata-$TAG-win32-x64.zip"  "jawata-$TAG"
        cp jawata-$TAG-win32-x64.zip "jawata-$TAG-macos-x64.zip"
        cp jawata-$TAG-win32-x64.zip "jawata-$TAG-macos-arm64.zip"
        rm -rf "jawata-$TAG"
        echo "=== packaged artifacts ===" && ls -la jawata-"$TAG"-*

    - name: Pick release body
      id: notes
      run: |
        notes_file="docs/release-notes/${{ github.ref_name }}.md"
        if [ -f "$notes_file" ]; then
          echo "body_path=$notes_file" >> "$GITHUB_OUTPUT"
        else
          echo "body_path=" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/dist/target/jawata-${{ github.ref_name }}-*.tar.gz
          build/dist/target/jawata-${{ github.ref_name }}-*.zip
        body_path: ${{ steps.notes.outputs.body_path }}
        generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # NOTE: npm-publish and MCP-Registry-publish steps are intentionally
    # omitted. jawata-studio downloads the jar archives directly from the
    # GitHub Release attached above, which is all the runtime path needs.
