# Sprint 28 (C1, consolidated audit). The Gradle Tooling API resolves its
# distribution from THIS file when the project has one; without it the connector
# falls back to a default it must discover, which is why the jar-resolution cell
# skipped on every machine that had no Gradle installed.
#
# Pinning it here makes that cell PROVABLE in CI (where the distribution can be
# downloaded and cached) while it still skips honestly on a developer machine
# that is offline. A skipped cell is reported as unproven, never as passing.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
